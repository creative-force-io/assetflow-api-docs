              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
  '/orders/{id}/description':
    patch:
      tags:
        - Orders
      summary: Update the description of an order.
      description: Update the description of an order.
      operationId: updateOrderDescription
      parameters:
        - name: id
          in: path
          description: The id of the order to update the description of.
          required: true
          schema:
            type: integer
            format: int32
          example: 50
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  example: This is a description.
      responses:
        '200':
          description: Successful operation
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
