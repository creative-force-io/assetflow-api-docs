openapi: 3.0.3
info:
  title: Prostudio Workflow API
  description: >-
    This is a API specification for the Prostudio Workflow API. This API is used
    to interact with the Prostudio Workflow system.

    The API is used to create, read, update and delete data in the Prostudio
    Workflow system.
  termsOfService: 'http://prostudioforworkflow.profoto.com'
  contact:
    email: support@profoto.com
    name: Prostudio Workflow Support
    url: 'https://support.profoto.com/en/support/solutions/79000058200'
  version: 1.0.0
externalDocs:
  description: Find out more about Prostudio Workflow
  url: 'http://prostudioforworkflow.profoto.com'
servers:
  - url: 'https://{subdomain}.prostudio.cloud/api/v1'
    variables:
      subdomain:
        default: your-subdomain
        description: Customer unique subdomain assigned by the service provider
    description: Production server
tags:
  - name: Authentication
    description: >-
      ProStudio API requires users to authenticate before accessing protected
      endpoints.

      Users must obtain a JWT token by providing their credentials via the
      `/login` endpoint. 

      This token must then be used in the `Authorization` header for subsequent
      requests.
  - name: Assets
    description: Operations about assets
  - name: Products
    description: Operations about products
  - name: Sites
    description: Operations about sites
  - name: Settings
    description: Operations about settings
  - name: Users
    description: Operations about user
paths:
  /login:
    post:
      tags:
        - Authentication
      summary: Login to the system.
      description: Login to the system with email and password.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: my@email.com
                  format: email
                  description: The email of the user.
                password:
                  type: string
                  example: password
                  description: The password of the user.
              required:
                - email
                - password
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /assets:
    get:
      tags:
        - Assets
      summary: Returns a list of assets.
      description: Returns a list of assets.
      operationId: getAssets
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetArray'
  '/assets/{id}':
    get:
      tags:
        - Assets
      summary: Returns an asset by id.
      description: Returns an asset by id.
      operationId: getAssetById
      parameters:
        - name: id
          in: path
          description: The id of the asset to return.
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '404':
          $ref: '#/components/responses/NotFoundError'
  '/assets/{id}/status':
    patch:
      tags:
        - Assets
      summary: Update the status of an asset.
      description: Update the status of an asset.
      operationId: updateAssetStatus
      parameters:
        - name: id
          in: path
          description: The id of the asset to update the status of.
          required: true
          schema:
            type: integer
            format: int32
          example: 50
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: 6125a0ca4e99426497bbb998fe9f78b5
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '300':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  '/assets/{id}/attributes':
    patch:
      tags:
        - Assets
      summary: Update the attributes of an asset.
      description: Update the attributes of an asset.
      operationId: updateAssetAttributes
      parameters:
        - name: id
          in: path
          description: The id of the asset to update the attributes of.
          required: true
          schema:
            type: integer
            format: int32
          example: 50
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  example:
                    key: value
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '300':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /products:
    get:
      tags:
        - Products
      summary: Returns a list of products.
      description: Returns a list of products.
      operationId: getProducts
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  links:
                    $ref: '#/components/schemas/Links'
                  meta:
                    $ref: '#/components/schemas/Meta'
  '/products/{id}':
    get:
      tags:
        - Products
      summary: Returns a product by id.
      description: Returns a product by id.
      operationId: getProductById
      parameters:
        - name: id
          in: path
          description: The id of the product to return.
          required: true
          schema:
            type: string
            format: int32
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFoundError'
  '/products/{id}/checkin/{site}':
    post:
      tags:
        - Products
      summary: Checkin a product to a site.
      description: Checkin a product to a site.
      operationId: checkinProduct
      parameters:
        - name: id
          in: path
          description: The id of the product to checkin.
          required: true
          schema:
            type: string
            format: int32
        - name: site
          in: path
          description: The id of the site to checkin the product to.
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFoundError'
  '/products/{id}/checkout/{site}':
    post:
      tags:
        - Products
      summary: Checkout a product from a site.
      description: Checkout a product from a site.
      operationId: checkoutProduct
      parameters:
        - name: id
          in: path
          description: The id of the product to checkout.
          required: true
          schema:
            type: string
            format: int32
        - name: site
          in: path
          description: The id of the site to checkout the product from.
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /orders:
    get:
      tags:
        - Orders
      summary: Returns a list of orders.
      description: Returns a list of orders.
      operationId: getOrders
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  links:
                    $ref: '#/components/schemas/Links'
                  meta:
                    $ref: '#/components/schemas/Meta'
  '/orders/{id}':
    get:
      tags:
        - Orders
      summary: Returns an order by id.
      description: Returns an order by id.
      operationId: getOrderById
      parameters:
        - name: id
          in: path
          description: The id of the order to return.
          required: true
          schema:
            type: string
            format: int32
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFoundError'
  '/orders/{id}/status':
    patch:
      tags:
        - Orders
      summary: Update the status of an order.
      description: Update the status of an order.
      operationId: updateOrderStatus
      parameters:
        - name: id
          in: path
          description: The id of the order to update the status of.
          required: true
          schema:
            type: integer
            format: int32
          example: 50
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: 6125a0ca4e99426497bbb998fe9f78b5
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '300':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  '/orders/{id}/description':
    patch:
      tags:
        - Orders
      summary: Update the description of an order.
      description: Update the description of an order.
      operationId: updateOrderDescription
      parameters:
        - name: id
          in: path
          description: The id of the order to update the description of.
          required: true
          schema:
            type: integer
            format: int32
          example: 50
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  example: This is a description.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '300':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  '/orders/{id}/attributes':
    patch:
      tags:
        - Orders
      summary: Update the attributes of an order.
      description: Update the attributes of an order.
      operationId: updateOrderAttributes
      parameters:
        - name: id
          in: path
          description: The id of the order to update the attributes of.
          required: true
          schema:
            type: integer
            format: int32
          example: 50
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  example:
                    key: value
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/Error'
  '/orders/{id}/products/{product_id}':
    post:
      tags:
        - Orders
      summary: Add a product to an order.
      description: Add a product to an order.
      operationId: addProductToOrder
      parameters:
        - name: id
          in: path
          description: The id of the order to add the product to.
          required: true
          schema:
            type: string
            format: int32
        - name: product_id
          in: path
          description: The id of the product to add to the order.
          required: true
          schema:
            type: string
            format: int32
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/Error'
  '/orders/{id}/products':
    get:
      tags:
        - Orders
      summary: Returns a list of products in an order.
      description: Returns a list of products in an order.
      operationId: getProductsInOrder
      parameters:
        - name: id
          in: path
          description: The id of the order to return the products of.
          required: true
          schema:
            type: string
            format: int32
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  links:
                    $ref: '#/components/schemas/Links'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '404':
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/Error'
  '/orders/{id}/products/{product_id}/status':
    patch:
      tags:
        - Orders
      summary: Update the status of a product in an order.
      description: Update the status of a product in an order.
      operationId: updateProductStatusInOrder
      parameters:
        - name: id
          in: path
          description: The id of the order to update the product status of.
          required: true
          schema:
            type: string
            format: int32
        - name: product_id
          in: path
          description: The id of the product to update the status of.
          required: true
          schema:
            type: string
            format: int32
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: 6125a0ca4e99426497bbb998fe9f78b5
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/Error'
  '/orders/{id}/assets':
    get:
      tags:
        - Orders
      summary: Returns a list of assets in an order.
      description: Returns a list of assets in an order.
      operationId: getAssetsInOrder
      parameters:
        - name: id
          in: path
          description: The id of the order to return the assets of.
          required: true
          schema:
            type: string
            format: int32
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Asset'
                  links:
                    $ref: '#/components/schemas/Links'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /sites:
    get:
      tags:
        - Sites
      summary: Returns a list of sites.
      description: Returns a list of sites.
      operationId: getSites
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteArray'
  '/sites/{id}':
    get:
      tags:
        - Sites
      summary: Returns a site by id.
      description: Returns a site by id.
      operationId: getSiteById
      parameters:
        - name: id
          in: path
          description: The id of the site to return.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /settings/attributes/asset:
    get:
      tags:
        - Settings
        - Assets
      summary: Returns a list of asset attributes.
      description: Returns a list of asset attributes.
      operationId: getAssetAttributes
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicAttributes'
  /settings/attributes/order:
    get:
      tags:
        - Settings
        - Orders
      summary: Returns a list of order attributes.
      description: Returns a list of order attributes.
      operationId: getOrderAttributes
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicAttributes'
  /settings/attributes/project:
    get:
      tags:
        - Settings
        - Projects
      summary: Returns a list of project attributes.
      description: Returns a list of project attributes.
      operationId: getProjectAttributes
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicAttributes'
  /settings/attributes/product:
    get:
      tags:
        - Settings
        - Products
      summary: Returns a list of product attributes.
      description: Returns a list of product attributes.
      operationId: getProductAttributes
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAttributes'
  /settings/attributes/view:
    get:
      tags:
        - Settings
        - Views
      summary: Returns a list of view attributes.
      description: Returns a list of view attributes.
      operationId: getViewAttributes
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicAttributes'
  /users:
    get:
      tags:
        - Users
      summary: Returns a list of users.
      description: Returns a list of users.
      operationId: getUsers
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserArray'
  '/users/{global_id}':
    get:
      tags:
        - Users
      summary: Returns a user by global_id.
      description: Returns a user by global_id.
      operationId: getUserByGlobalId
      parameters:
        - name: global_id
          in: path
          description: The global_id of the user to return.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /users/me:
    get:
      tags:
        - Users
      summary: Returns the user that is currently logged in.
      description: Returns the user that is currently logged in.
      operationId: getCurrentUser
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/AuthorizationError'
components:
  responses:
    Error:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundError'
    AuthenticationError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthenticationError'
    AuthorizationError:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthorizationError'
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
  schemas:
    Asset:
      required:
        - id
        - name
      type: object
      properties:
        id:
          type: integer
          example: 50
        status:
          $ref: '#/components/schemas/Status'
        name:
          type: string
          nullable: true
          example: null
        fileextension:
          type: string
          nullable: true
          example: null
        filename:
          type: string
          example: noimage_thumb.png
        mimetype:
          type: string
          nullable: true
          example: null
        filesize:
          type: integer
          nullable: true
          example: null
        url:
          type: string
          format: uri
          example: 'https://your-subdomain.prostudio.cloud/signed/asset/urls/here.png'
        aspect_ratio:
          type: number
          nullable: true
          example: null
        view:
          type: string
          nullable: true
          example: null
        thumbnail:
          type: string
          format: uri
          example: 'https://your-subdomain.prostudio.cloud/thumbnail/urls/here.png'
        data:
          type: object
          example:
            key: value
          nullable: true
        models:
          type: array
          items:
            type: object
          example: []
        order:
          type: integer
          nullable: true
          example: null
    AssetArray:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
        links:
          $ref: '#/components/schemas/Links'
        meta:
          $ref: '#/components/schemas/Meta'
    ProductAttributes:
      required:
        - attributes
      type: object
      properties:
        attributes:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                format: uuid
                example: 123e4567-e89b-12d3-a456-426614174000
              name:
                type: string
                example: number
              type:
                type: string
                example: text
              required:
                type: boolean
                example: true
              sortorder:
                type: integer
                example: 10
              validation:
                type: string
                description: >-
                  Validation rules for the attribute based on Laravel validation
                  rules.
    DynamicAttributes:
      required:
        - attributes
      type: object
      properties:
        attributes:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                format: uuid
                example: 123e4567-e89b-12d3-a456-426614174000
              name:
                type: string
                example: number
              type:
                type: string
                example: text
              required:
                type: boolean
                example: true
              sortorder:
                type: integer
                example: 10
              validation:
                type: string
                description: >-
                  Validation rules for the attribute based on Laravel validation
                  rules.
    Site:
      required:
        - id
        - type
        - name
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        type:
          type: string
          example: Warehouse
        name:
          type: string
          example: Warehouse One
    SiteArray:
      type: array
      items:
        $ref: '#/components/schemas/Site'
    User:
      required:
        - global_id
        - email
        - firstname
        - lastname
      type: object
      properties:
        global_id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        email:
          type: string
          example: example@example.com
        firstname:
          type: string
          example: John
        lastname:
          type: string
          example: Doe
    UserArray:
      type: array
      items:
        $ref: '#/components/schemas/User'
    Product:
      required:
        - id
      properties:
        id:
          type: integer
          format: int32
          example: '123567'
        shortname:
          type: string
          example: Product One - 1234551
        data:
          type: object
          example:
            key: value
        checkedin:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00.000Z'
        updated_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00.000Z'
        deleted_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00.000Z'
        deleted_by:
          $ref: '#/components/schemas/User'
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
    ProductArray:
      type: array
      items:
        $ref: '#/components/schemas/Product'
    Order:
      required:
        - id
        - description
      properties:
        id:
          type: integer
          format: int32
          example: '123456'
        shortname:
          type: string
          example: Order One - 1234551
        data:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                example: value
    Project:
      required:
        - id
        - name
        - description
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          example: Project One - 1234551
    Status:
      type: object
      properties:
        key:
          type: string
          example: 6125a0ca4e99426497bbb998fe9f78b5
        name:
          type: string
          example: Test status
        color:
          type: string
          example: blue-500
        state:
          type: string
          example: todo
        colorhex:
          type: string
          example: '#35a7ff'
        sortorder:
          type: integer
          example: 10
        default_draft:
          type: boolean
          example: false
        default_archived:
          type: boolean
          example: false
        default_confirmed:
          type: boolean
          example: false
      required:
        - key
        - name
        - color
        - state
        - colorhex
        - sortorder
    Token:
      required:
        - data
      type: object
      properties:
        data:
          type: object
          properties:
            token:
              type: string
              example: >-
                eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
            expires_at:
              type: string
              format: date-time
              example: '2021-01-01T00:00:00.000Z'
    Links:
      type: object
      properties:
        first:
          type: string
          format: uri
          example: 'https://your-subdomain.prostudio.cloud/api/v1/assets?page=1'
        last:
          type: string
          format: uri
          example: 'https://your-subdomain.prostudio.cloud/api/v1/assets?page=1'
        prev:
          type: string
          nullable: true
          format: uri
          example: null
        next:
          type: string
          nullable: true
          format: uri
          example: null
    Meta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        from:
          type: integer
          example: 1
        last_page:
          type: integer
          example: 1
        links:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                nullable: true
                format: uri
                example: null
              label:
                type: string
                example: '&laquo; Previous'
              active:
                type: boolean
                example: false
        path:
          type: string
          format: uri
          example: 'https://tenant1.localhost/api/v1/assets'
        per_page:
          type: integer
          example: 15
        to:
          type: integer
          example: 4
        total:
          type: integer
          example: 4
    Error:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code of the error
        title:
          type: string
          description: 'A short, human-readable summary of the problem'
        detail:
          type: string
          description: A detailed human-readable explanation of the problem
        path:
          type: string
          description: The URI of the request that caused the error
        timestamp:
          type: string
          format: date-time
          description: Time the error occurred
      required:
        - status
        - title
        - detail
      example:
        status: 500
        title: Internal Server Error
        detail: An unexpected error occurred on the server.
        timestamp: '2024-08-21T10:00:00Z'
        path: /api/resource
    ValidationError:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code of the error
        title:
          type: string
          description: A short summary of the validation error
        detail:
          type: string
          description: A general error message
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                description: The field that failed validation
              error:
                type: string
                description: Reason why the validation failed
        path:
          type: string
          description: The URI of the request that caused the error
      required:
        - status
        - title
        - detail
      example:
        status: 400
        title: Validation Error
        detail: One or more fields failed validation.
        errors:
          - field: email
            error: Email is invalid.
          - field: password
            error: Password must be at least 8 characters.
        path: /api/register
    AuthenticationError:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code of the error
        title:
          type: string
          description: A short summary of the authentication error
        detail:
          type: string
          description: Detailed authentication error message
        path:
          type: string
          description: The URI of the request that caused the error
      required:
        - status
        - title
        - detail
      example:
        status: 401
        title: Unauthorized
        detail: Invalid authentication token.
        path: /api/protected-resource
    AuthorizationError:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code of the error
        title:
          type: string
          description: A short summary of the authorization error
        detail:
          type: string
          description: Detailed authorization error message
        path:
          type: string
          description: The URI of the request that caused the error
      required:
        - status
        - title
        - detail
      example:
