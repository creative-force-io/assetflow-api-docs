openapi: 3.1.0
info:
  title: Prostudio Workflow API
  description: >-
    This is the API specification for the Prostudio Workflow API, used to
    interact with the Prostudio Workflow system. The API enables CRUD (Create,
    Read, Update, Delete) operations across various resources within the
    workflow system, such as assets, products, orders, and users.


    ## Authentication


    The API uses Bearer Token authentication to ensure secure access. A valid
    access token must be included in the `Authorization` header for each request
    to protected endpoints.


    ### How to Authenticate


    To access protected endpoints, include the token in the `Authorization`
    header like so:


    ```

    Authorization: Bearer <your-access-token>

    ```


    ### Obtaining Tokens


    Tokens can be obtained by authenticating through the `/login` endpoint using
    valid credentials (email and password). On successful authentication, the
    API returns both an **access token** and a **refresh token**.


    ### Token Expiration


    - **Access Token**: Expires after a predefined time period.

    - **Refresh Token**: Does not expire by default but can be revoked. It's
    used to obtain new access tokens without re-authenticating.


    To refresh the access token, use the `/refresh-token` endpoint with a valid
    refresh token.


    ### Token Best Practices


    - Store tokens securely (e.g., environment variables or secure storage).

    - Revoke compromised tokens immediately via the API's token revocation
    endpoints.

    - Always use HTTPS to transmit tokens securely.


    ### Error Handling


    If the token is missing, invalid, or expired, the API returns a 401
    (Unauthorized) error. Handle this by prompting the user to re-authenticate
    or refresh the token.


    ## Filtering, Sorting, and Including Relations


    The API supports advanced querying features for filtering, sorting, and
    including related resources in responses. These options allow you to
    customize the data returned based on your needs.


    - **Filtering**: Filter responses by fields. For example, to filter users by
    status, use `GET /users?filter[status]=active`.

    - **Sorting**: Sort results by specific fields. Example: `GET
    /users?sort=-created_at` to sort by creation date in descending order.

    - **Including Relations**: Include related resources with the `include`
    parameter. For example, `GET /users?include=posts` includes related posts
    for each user.


    Check each endpoint's documentation for available filters, sorts, and
    relations.


    ## Pagination


    For large datasets, the API implements pagination to optimize performance.
    Pagination is controlled by the `per_page` parameter.


    ### Pagination Response


    Paginated responses include `Links` and `Meta` objects that provide
    navigation links and pagination metadata (current page, total items, etc.).
    Use these to navigate through large data sets efficiently.


    ## Rate Limiting


    To ensure stability and fair usage, rate limiting is implemented across the
    API. The API restricts the number of requests within a given time period. If
    the rate limit is exceeded, further requests will be blocked until the time
    window resets.


    ### Rate Limit Details


    - **Requests per Minute**: The maximum number of requests allowed per minute
    (global limit across all endpoints).

    - **Burst Capacity**: Occasional bursts of requests may be allowed but
    sustained high-frequency requests will trigger rate limiting.

    - **Reset Period**: Rate limits reset every minute.


    When rate limiting is active, the API includes the following headers in
    responses:


    - `X-RateLimit-Limit`: Total number of allowed requests in the current
    window.

    - `X-RateLimit-Remaining`: Number of requests left in the current window.

    - `X-RateLimit-Reset`: UNIX timestamp of when the rate limit window will
    reset.


    ### Handling Rate Limits


    If a 429 (Too Many Requests) error occurs, the client should back off and
    retry the request after the reset time indicated by the `X-RateLimit-Reset`
    header.


    ## Best Practices


    - Optimize API calls by reducing unnecessary requests.

    - Use filtering and sorting to request only the data you need.

    - Paginate large datasets for better performance.

    - Monitor your usage with rate limit headers and distribute requests over
    time to avoid rate limiting.


    If you require higher rate limits or additional API features, contact our
    support team.
