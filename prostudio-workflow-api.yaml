paths:
  /login:
    post:
      tags:
        - Authentication
      summary: Login to the system
      description: >-
        Login to the system using email and password, and obtain an access token
        and a refresh token.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: my@email.com
                  format: email
                  description: The email of the user.
                password:
                  type: string
                  example: password
                  description: The password of the user.
              required:
                - email
                - password
      responses:
        '200':
          description: Successful login and token issuance
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: JWT access token for authentication
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refresh_token:
                    type: string
                    description: JWT refresh token used for obtaining new access tokens
                    example: 137|3l4HRzougoZats4Tw7ro78M9cIqlXFz4k24XzHAX90902f28
                  expires_at:
                    type: string
                    format: date-time
                    description: Expiry date and time for the access token
                    example: '2024-12-31T23:59:59.000Z'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 401
                title: Unauthorized
                detail: Email & Password do not match with our record.
  /refresh-token:
    post:
      tags:
        - Authentication
      summary: Refresh JWT Token
      description: Endpoint to refresh the JWT token using a valid refresh token.
      operationId: refreshToken
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: The refresh token used to obtain a new access token.
                  example: 137|3l4HRzougoZats4Tw7ro78M9cIqlXFz4k24XzHAX90902f28
              required:
                - refresh_token
      responses:
        '200':
          description: Successful refresh of token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: The newly issued JWT token.
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refresh_token:
                    type: string
                    description: Newly issued refresh token.
                    example: 137|3l4HRzougoZats4Tw7ro78M9cIqlXFz4k24XzHAX90902f28
                  expires_at:
                    type: string
                    format: date-time
                    description: The expiry date of the new token.
                    example: '2024-12-31T23:59:59.000Z'
        '401':
          description: Unauthorized or invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 401
                title: Unauthorized
                detail: Invalid refresh token.
  /assets:
    get:
      tags:
        - Assets
      summary: Returns a list of assets.
      description: Returns a list of assets.
      operationId: getAssets
      parameters:
        - $ref: '#/components/parameters/FilterById'
      responses:
        '200':
          description: Successful operation
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Asset'
                  links:
                    $ref: '#/components/schemas/Links'
                  meta:
                    $ref: '#/components/schemas/Meta'
        default:
          $ref: '#/components/responses/Error'
  '/assets/{id}':
    get:
      tags:
        - Assets
      summary: Returns an asset by id.
      description: Returns an asset by id.
      operationId: getAssetById
      parameters:
        - name: id
          in: path
          description: The id of the asset to return.
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Successful operation
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '404':
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/Error'
  '/assets/{id}/status':
    patch:
      tags:
        - Assets
      summary: Update the status of an asset.
      description: Update the status of an asset.
      operationId: updateAssetStatus
      parameters:
        - name: id
          in: path
          description: The id of the asset to update the status of.
          required: true
          schema:
            type: integer
            format: int32
          example: 50
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: 6125a0ca4e99426497bbb998fe9f78b5
      responses:
        '200':
          description: Successful operation
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
  '/assets/{id}/attributes':
    patch:
      tags:
        - Assets
      summary: Update the attributes of an asset.
      description: Update the attributes of an asset.
      operationId: updateAssetAttributes
      parameters:
        - name: id
          in: path
          description: The id of the asset to update the attributes of.
          required: true
          schema:
            type: integer
            format: int32
          example: 50
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  example:
                    123e4567-e89b-12d3-a456-426614174000: my new value
      responses:
        '200':
          description: Successful operation
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /products:
    get:
      tags:
        - Products
      summary: Returns a list of products.
      description: Returns a list of products.
      operationId: getProducts
      parameters:
        - $ref: '#/components/parameters/FilterById'
        - $ref: '#/components/parameters/FilterByShortname'
        - $ref: '#/components/parameters/FilterByCreated'
        - $ref: '#/components/parameters/FilterByUpdated'
        - $ref: '#/components/parameters/IncludeAssets'
        - $ref: '#/components/parameters/IncludeProject'
      responses:
        '200':
          description: Successful operation
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  links:
                    $ref: '#/components/schemas/Links'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
        - Products
      summary: Create a new product/products.
      description: >-
        Create a new product or multiple products. You can create a single
        product or multiple products in a single request. If you're creating
        multiple products, send an array of product objects. Maximum 5000
        products can be created in a single request.
      operationId: createProduct
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ProductCreate'
                - type: array
                  items:
                    $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: Successful operation
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  links:
                    $ref: '#/components/schemas/Links'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags:
        - Products
      summary: Update a product by identifier attributes.
      description: >-
        Update a product by identifier attributes. 
        Use identifiers key to fetch the product and the attributes key to force update the existing values with the provided ones. 
        Values that are type tags, can be updated only by using the key value of each tag. 
        Check `settings/attributes/project` to get available key values of tags.
      operationId: updateProduct
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: Successful operation
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
  '/products/{id}':
    get:
      tags:
        - Products
      summary: Returns a product by id.
      description: Returns a product by id.
      operationId: getProductById
      parameters:
        - name: id
          in: path
          description: The id of the product to return.
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Successful operation
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags:
        - Products
      summary: Update a product by attributes.
      deprecated: true
      description: >-
        Update a product by identifier attributes. 
        The id on the url will not be used to identify the product.
        Use attributes key to identify the product and update the existing values with the provided ones.
        There is no way to update identifier attributes through this endpoint.
        Values that are type tags, can be updated only by using the key value of each tag. 
        Check `settings/attributes/project` to get available key values of tags. This endpoint will be deprecated with PATCH `/products`
      operationId: updateProductById
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: Successful operation
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
  '/products/{id}/checkin/{site}':
    post:
      tags:
        - Products
      summary: Checkin a product to a site.
      description: Checkin a product to a site.
      operationId: checkinProduct
      parameters:
        - name: id
          in: path
          description: The id of the product to checkin.
          required: true
          schema:
            type: string
            format: int32
        - name: site
          in: path
          description: The id of the site to checkin the product to.
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Successful operation
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFoundError'
  '/products/{id}/checkout/{site}':
    post:
      tags:
        - Products
      summary: Checkout a product from a site.
      description: Checkout a product from a site.
      operationId: checkoutProduct
      parameters:
        - name: id
          in: path
          description: The id of the product to checkout.
          required: true
          schema:
            type: string
            format: int32
        - name: site
          in: path
          description: The id of the site to checkout the product from.
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Successful operation
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /orders:
    get:
      tags:
        - Orders
      summary: Returns a list of orders.
      description: Returns a list of orders.
      operationId: getOrders
      parameters:
        - $ref: '#/components/parameters/FilterById'
        - $ref: '#/components/parameters/FilterByDescription'
        - $ref: '#/components/parameters/IncludeProducts'
        - $ref: '#/components/parameters/IncludeAssets'
        - $ref: '#/components/parameters/IncludeAssetsProducts'
        - $ref: '#/components/parameters/IncludeStudio'
      responses:
        '200':
          description: Successful operation
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  links:
                    $ref: '#/components/schemas/Links'
                  meta:
                    $ref: '#/components/schemas/Meta'
    post:
      tags:
        - Orders
      summary: Create an order.
      description: Create an order.
      operationId: createOrder
      requestBody:
        content:
          application/json:
            example:
              data:
                description: My new order
                attributes:
                  key: value
                relationships:
                  project:
                    data:
                      - type: project
                        id: 1
                  studio:
                    data:
                      type: studio
                      id: 1
      responses:
        '201':
          description: Successful operation
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              example:
                data:
                  - type: webhook
                    id: 1
                    url: 'https://example.com/webhook'
                    events:
                      - order.created
                      - order.updated
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/Error'
  '/orders/{id}':
    get:
      tags:
        - Orders
      summary: Returns an order by id.
      description: Returns an order by id.
      operationId: getOrderById
      parameters:
        - name: id
          in: path
          description: The id of the order to return.
          required: true
          schema:
            type: string
            format: int32
      responses:
        '200':
          description: Successful operation
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFoundError'
  '/orders/{id}/status':
    patch:
      tags:
        - Orders
      summary: Update the status of an order.
      description: Update the status of an order.
      operationId: updateOrderStatus
      parameters:
        - name: id
          in: path
          description: The id of the order to update the status of.
          required: true
          schema:
            type: integer
            format: int32
          example: 50
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: 6125a0ca4e99426497bbb998fe9f78b5
      responses:
        '200':
          description: Successful operation
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
