components:
  parameters:
    FilterById:
      in: query
      name: 'filter[id]'
      description: Filter by id with exact match.
      required: false
      schema:
        type: integer
        example: '123'
    FilterByShortname:
      in: query
      name: 'filter[shortname]'
      description: Filter by shortname.
      required: false
      schema:
        type: string
        example: jacket
    FilterByStatus:
      in: query
      name: 'filter[status]'
      description: Filter by status key.
      required: false
      schema:
        type: string
        example: 123124-1231234214-23123
    FilterByCreated:
      in: query
      name: 'filter[status]'
      description: Filter by created timestamp.
      required: false
      schema:
        type: string
        example: '2021-01-01T00:00:00Z'
    FilterByUpdated:
      in: query
      name: 'filter[status]'
      description: Filter by updated timestamp.
      required: false
      schema:
        type: string
        example: '2021-01-01T00:00:00Z'
    FilterByDescription:
      in: query
      name: 'filter[description]'
      description: Filter by description.
      required: false
      schema:
        type: string
        example: This is a description.
    IncludeProducts:
      in: query
      name: include=products
      description: Include products in the response.
      required: false
      schema:
        type: string
        example: products
    IncludeAssetsProducts:
      in: query
      name: include=assets.products
      description: Include assets and products in the response.
      required: false
      schema:
        type: string
        example: 'assets,products'
    IncludeStudio:
      in: query
      name: include=studio
      description: Include studio in the response.
      required: false
      schema:
        type: string
        example: studio
    IncludeAssets:
      in: query
      name: include=assets
      description: Include assets in the response.
      required: false
      schema:
        type: string
        example: assets
    IncludeProject:
      in: query
      name: include=project
      description: Include project in the response.
      required: false
      schema:
        type: string
        example: project
  responses:
    Error:
      description: Internal server error
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        'X-RateLimit-Remaining:':
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundError:
      description: Resource not found
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        'X-RateLimit-Remaining:':
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundError'
    AuthenticationError:
      description: Unauthorized
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        'X-RateLimit-Remaining:':
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthenticationError'
    AuthorizationError:
      description: Forbidden
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        'X-RateLimit-Remaining:':
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthorizationError'
    ValidationError:
      description: Validation error
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        'X-RateLimit-Remaining:':
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
  headers:
    X-RateLimit-Limit:
      description: Request limit per hour
      schema:
        type: integer
      example: 100
    X-RateLimit-Remaining:
      description: Remaining requests
      schema:
        type: integer
      example: 94
    X-RateLimit-Reset:
      description: Time in seconds until the rate limit resets
      schema:
        type: integer
      example: 60
  schemas:
    Asset:
      required:
        - id
        - name
      type: object
      properties:
        id:
          type: integer
          example: 50
        status:
          $ref: '#/components/schemas/Status'
        name:
          type: string
          nullable: true
          example: null
        fileextension:
          type: string
          nullable: true
          example: null
        filename:
          type: string
          example: noimage_thumb.png
        mimetype:
          type: string
          nullable: true
          example: null
        filesize:
          type: integer
          nullable: true
          example: null
        url:
          type: string
          format: uri
          example: 'https://your-subdomain.prostudio.cloud/signed/asset/urls/here.png'
        aspect_ratio:
          type: number
          nullable: true
          example: null
        view:
          type: string
          nullable: true
          example: null
        thumbnail:
          type: string
          format: uri
          example: 'https://your-subdomain.prostudio.cloud/thumbnail/urls/here.png'
        data:
          type: object
          example:
            78796b73-f520-463b-bf4a-aa0364b146db: >-
              the value of the attribute with the key
              78796b73-f520-463b-bf4a-aa0364b146db
            78796b73-f520-463b-bf4a-aa0364b146dc: >-
              the value of the attribute with the key
              78796b73-f520-463b-bf4a-aa0364b146dc
            78796b73-f520-463b-bf4a-aa0364b146dd: >-
              the value of the attribute with the key
              78796b73-f520-463b-bf4a-aa0364b146dd
          nullable: true
        models:
          type: array
          items:
            type: object
          example: []
        order:
          type: integer
          nullable: true
          example: null
    AssetArray:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
        links:
          $ref: '#/components/schemas/Links'
        meta:
          $ref: '#/components/schemas/Meta'
