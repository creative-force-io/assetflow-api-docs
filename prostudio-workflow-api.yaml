components:
  parameters:
    AcceptHeader:
      in: header
      name: Accept
      required: true
      schema:
        type: string
        enum:
          - application/json
      description: Media type the client is able to understand.
    FilterById:
      in: query
      name: 'filter[id]'
      description: Filter by id with exact match.
      required: false
      schema:
        type: integer
        example: '123'
    FilterByShortname:
      in: query
      name: 'filter[shortname]'
      description: Filter by shortname.
      required: false
      schema:
        type: string
        example: jacket
    FilterByStatus:
      in: query
      name: 'filter[status]'
      description: Filter by status key.
      required: false
      schema:
        type: string
        example: 123124-1231234214-23123
    FilterByCreated:
      in: query
      name: 'filter[created_at]'
      description: Filter by created timestamp.
      required: false
      schema:
        type: string
        example: '2021-01-01T00:00:00Z'
    FilterByUpdated:
      in: query
      name: 'filter[updated_at]'
      description: Filter by updated timestamp.
      required: false
      schema:
        type: string
        example: '2021-01-01T00:00:00Z'
    FilterByDescription:
      in: query
      name: 'filter[description]'
      description: Filter by description.
      required: false
      schema:
        type: string
        example: This is a description.
    IncludeProducts:
      in: query
      name: include=products
      description: Include products in the response.
      required: false
      schema:
        type: string
        example: products
    IncludeAssetsProducts:
      in: query
      name: include=assets.products
      description: Include assets and products in the response.
      required: false
      schema:
        type: string
        example: 'assets,products'
    IncludeStudio:
      in: query
      name: include=studio
      description: Include studio in the response.
      required: false
      schema:
        type: string
        example: studio
    IncludeAssets:
      in: query
      name: include=assets
      description: Include assets in the response.
      required: false
      schema:
        type: string
        example: assets
    IncludeProject:
      in: query
      name: include=project
      description: Include project in the response.
      required: false
      schema:
        type: string
        example: project
  responses:
    Error:
      description: Internal server error
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundError:
      description: Resource not found
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
