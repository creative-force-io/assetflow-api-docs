          type: string
          example: '#35a7ff'
        sortorder:
          type: integer
          example: 10
        default_draft:
          type: boolean
          example: false
        default_archived:
          type: boolean
          example: false
        default_confirmed:
          type: boolean
          example: false
      required:
        - key
        - name
        - color
        - state
        - colorhex
        - sortorder
    Webhook:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: '123456'
        name:
          type: string
          example: Webhook One
        url:
          type: string
          format: uri
          example: 'https://my-webhook.com/123123'
        events:
          type: array
          items:
            type: string
            example: order.status_updated
        created_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00+00:00'
        updated_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00+00:00'
      required:
        - name
        - url
        - events
    WebhookArray:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Webhook'
        links:
          $ref: '#/components/schemas/Links'
        meta:
          $ref: '#/components/schemas/Meta'
    Token:
      required:
        - data
      type: object
      properties:
        data:
          type: object
          properties:
            token:
              type: string
              example: >-
                eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
            expires_at:
              type: string
              format: date-time
              example: '2021-01-01T00:00:00.000Z'
    Links:
      type: object
      properties:
        first:
          type: string
          format: uri
          example: 'https://your-subdomain.prostudio.cloud/api/v1/assets?page=1'
        last:
          type: string
          format: uri
          example: 'https://your-subdomain.prostudio.cloud/api/v1/assets?page=1'
        prev:
          type: string
          nullable: true
          format: uri
          example: null
        next:
          type: string
          nullable: true
          format: uri
          example: null
    Meta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        from:
          type: integer
          example: 1
        last_page:
          type: integer
          example: 1
        links:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                nullable: true
                format: uri
                example: null
              label:
                type: string
                example: '&laquo; Previous'
              active:
                type: boolean
                example: false
        path:
          type: string
          format: uri
          example: 'https://tenant1.localhost/api/v1/assets'
        per_page:
          type: integer
          example: 15
        to:
          type: integer
          example: 4
        total:
          type: integer
          example: 4
    Error:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code of the error
        title:
          type: string
          description: 'A short, human-readable summary of the problem'
        detail:
          type: string
          description: A detailed human-readable explanation of the problem
        path:
          type: string
          description: The URI of the request that caused the error
        timestamp:
          type: string
          format: date-time
          description: Time the error occurred
      required:
        - status
        - title
        - detail
      example:
        status: 500
        title: Internal Server Error
        detail: An unexpected error occurred on the server.
        timestamp: '2024-08-21T10:00:00Z'
        path: /api/resource
    ValidationError:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code of the error
        title:
          type: string
          description: A short summary of the validation error
        detail:
          type: string
          description: A general error message
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                description: The field that failed validation
              error:
                type: string
                description: Reason why the validation failed
        path:
          type: string
          description: The URI of the request that caused the error
      required:
        - status
        - title
        - detail
      example:
        status: 400
        title: Validation Error
        detail: One or more fields failed validation.
        errors:
          - field: email
            error: Email is invalid.
          - field: password
            error: Password must be at least 8 characters.
        path: /api/register
    AuthenticationError:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code of the error
        title:
          type: string
          description: A short summary of the authentication error
        detail:
          type: string
          description: Detailed authentication error message
        path:
          type: string
          description: The URI of the request that caused the error
      required:
        - status
        - title
        - detail
      example:
        status: 401
        title: Unauthorized
        detail: Invalid authentication token.
        path: /api/protected-resource
    AuthorizationError:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code of the error
        title:
          type: string
          description: A short summary of the authorization error
        detail:
          type: string
          description: Detailed authorization error message
        path:
          type: string
          description: The URI of the request that caused the error
      required:
        - status
        - title
        - detail
      example:
        status: 403
        title: Forbidden
        detail: You do not have permission to access this resource.
        path: /api/admin
    NotFoundError:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code of the error
        title:
          type: string
          description: A short summary of the error
        detail:
          type: string
          description: Detailed message explaining that the resource was not found
        path:
          type: string
          description: The URI of the request that caused the error
      required:
        - status
        - title
        - detail
      example:
        status: 404
        title: Not Found
        detail: The requested resource could not be found.
        path: /api/nonexistent-resource
    ConflictError:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code of the error
        title:
          type: string
          description: A short summary of the conflict error
        detail:
          type: string
          description: Detailed message explaining the conflict
        path:
          type: string
          description: The URI of the request that caused the error
      required:
        - status
        - title
        - detail
      example:
        status: 409
        title: Conflict
        detail: A resource with the same identifier already exists.
        path: /api/resource
    RateLimitError:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code of the error
        title:
          type: string
          description: A short summary of the rate limiting error
        detail:
          type: string
          description: Detailed message explaining the rate limit violation
        retryAfter:
          type: string
          description: The time after which the client can retry the request
        path:
          type: string
          description: The URI of the request that caused the error
      required:
        - status
        - title
        - detail
        - retryAfter
      example:
        status: 429
        title: Too Many Requests
        detail: You have exceeded the rate limit.
        retryAfter: '2024-08-21T10:30:00Z'
        path: /api/resource
    InternalServerError:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code of the error
        title:
          type: string
          description: A short summary of the internal server error
        detail:
          type: string
          description: Detailed message explaining the server error
        path:
          type: string
          description: The URI of the request that caused the error
      required:
        - status
        - title
        - detail
      example:
        status: 500
        title: Internal Server Error
        detail: An unexpected error occurred on the server.
        path: /api/resource
    ServiceUnavailableError:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code of the error
        title:
          type: string
          description: A short summary of the service unavailability
        detail:
          type: string
          description: Detailed message explaining the service is unavailable
        path:
          type: string
          description: The URI of the request that caused the error
      required:
        - status
        - title
        - detail
      example:
        status: 503
        title: Service Unavailable
        detail: The service is temporarily unavailable. Please try again later.
        path: /api/resource
